name: Angry Musician APK

on:
  push:
    paths:
      - 'android-angry-musician/**'
      - '.github/workflows/angry-musician-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila APK
        working-directory: android-angry-musician
        run: gradle --no-daemon assembleRelease
      - name: Prepara file
        run: cp android-angry-musician/app/build/outputs/apk/release/app-release.apk AngryMusician.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: angry-musician-v3
          name: Angry Musician v3 (pixel art)
          body: "APK per Android di Angry Musician con grafica retro a pixel. Scarica AngryMusician.apk e installalo sul telefono."
          files: AngryMusician.apk
          make_latest: true
