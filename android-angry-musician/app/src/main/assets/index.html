<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Angry Musician</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{outline:none;position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#120a14;color:#ffd23f;font:900 22px/1.3 Impact,"Arial Black",sans-serif;text-align:center;padding:24px;z-index:5;letter-spacing:1px}
#rotate .ph{width:70px;height:120px;border:5px solid #ffd23f;border-radius:14px;animation:rot 1.8s ease-in-out infinite}
#rotate small{font:600 15px/1.4 system-ui,sans-serif;color:#ccc;letter-spacing:0}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="rotate"><div class="ph"></div><div>ANGRY MUSICIAN</div><div>Ruota il telefono in orizzontale</div><small>Il gioco si gioca a schermo orizzontale</small></div>
<script>
'use strict';
/* =========================================================
   ANGRY MUSICIAN — picchiaduro arcade
   Il Musicista (strumenti) contro il Regista incazzato (cavi)
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=540,GROUND=440,LS=0.4,NH=216;
let W=960,NW=384,dpr=1,dS=1,dX=0,dY=0,buf=null,u32=null,bcan=null,bctx=null,bgCache={};
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);
  NW=Math.max(384,Math.min(520,Math.round(NH*cv.width/Math.max(1,cv.height))));W=NW/LS;
  dS=Math.min(cv.width/NW,cv.height/NH);dX=Math.round((cv.width-NW*dS)/2);dY=Math.round((cv.height-NH*dS)/2);
  bcan=document.createElement('canvas');bcan.width=NW;bcan.height=NH;bctx=bcan.getContext('2d');buf=bctx.createImageData(NW,NH);u32=new Uint32Array(buf.data.buffer);bgCache={}}
addEventListener('resize',resize);resize();

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- AUDIO ---------------- */
let AC=null,master=null,musicGain=null,noiseBuf=null;
let musicOn=store.get('am_music',true),sfxOn=store.get('am_sfx',true);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.22;musicGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function osc(f,dur,type,vol,slide,t0,dest,vib){
  const t=t0||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=6;lg.gain.value=f*0.02;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.05)}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol,f1,f2,t0,dest,type){
  const t=t0||AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type||'bandpass';f.frequency.setValueAtTime(f1,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+0.03);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const SFX={
  hit(){osc(150,.14,'sine',.6,50);noise(.1,.45,2500,500)},
  heavy(){osc(120,.25,'sine',.75,38);noise(.2,.55,1800,200);osc(80,.2,'square',.12,40)},
  block(){osc(1400,.06,'square',.1,900);noise(.05,.25,5000)},
  whoosh(){noise(.16,.22,500,3200)},
  instr(k){const n=pick([57,60,62,64,67,69,72]);
    if(k==='trumpet')osc(NOTE(n+12),.28,'sawtooth',.18,0,0,0,true);
    else if(k==='violin')osc(NOTE(n+19),.35,'sawtooth',.12,0,0,0,true);
    else if(k==='sax')osc(NOTE(n+7),.3,'square',.13,0,0,0,true);
    else if(k==='maracas'){noise(.08,.3,7000);noise(.08,.3,7000,0,AC.currentTime+.1)}
    else{osc(160,.3,'sine',.6,60);noise(.1,.3,900)}},
  cable(){noise(.25,.35,300,5000);osc(55,.18,'sawtooth',.18,110)},
  wave(){osc(70,.7,'sawtooth',.3,40);osc(105,.7,'square',.15,60);noise(.6,.3,400,100,0,0,'lowpass')},
  superM(){[60,64,67,72,76,79].forEach((n,i)=>osc(NOTE(n+12),.25,'square',.12,0,AC.currentTime+i*.05))},
  ko(){[0,1,2,3,4].forEach(i=>osc(NOTE(72-i*3),.28,'square',.14,0,AC.currentTime+i*.12))},
  bell(){osc(880,.9,'triangle',.3);osc(1318,.7,'sine',.15)},
  go(){osc(NOTE(72),.12,'square',.15);osc(NOTE(79),.3,'square',.15,0,AC.currentTime+.1)},
  sel(){osc(660,.08,'square',.12,990)},
  win(){[60,64,67,72,67,72].forEach((n,i)=>osc(NOTE(n+12),.22,'square',.12,0,AC.currentTime+i*.13))},
  lose(){[67,63,60,55].forEach((n,i)=>osc(NOTE(n),.35,'triangle',.2,0,AC.currentTime+i*.22))},
  jump(){osc(300,.12,'square',.06,600)},
  applause(){for(let i=0;i<40;i++)noise(.05,.15,rnd(1500,4000),0,AC.currentTime+Math.random()*1.6,0,'bandpass')}
};
function sfx(n,a){if(AC&&sfxOn)try{SFX[n](a)}catch(e){}}

// musica di combattimento (funk in La minore, generata)
const BASS=[0,0,12,0,0,12,0,10,0,0,12,0,3,5,7,10, 5,5,17,5,5,17,5,3,7,7,19,7,2,3,5,7];
let musStep=0,musNext=0,musPlaying=false;
function musicTick(){
  const want=musicOn&&AC&&(G.screen==='fight'||G.screen==='intro')&&!G.paused;
  if(!want){musPlaying=false;return}
  if(!musPlaying){musPlaying=true;musNext=AC.currentTime+.05;musStep=0}
  const bpm=124+G.lvl*8,st=60/bpm/4;
  while(musNext<AC.currentTime+.15){
    const s=musStep%32,t=musNext;
    osc(NOTE(33+BASS[s]),st*1.6,'sawtooth',.35,0,t,musicGain);
    if(s%4===0)osc(110,.12,'sine',.8,40,t,musicGain);
    if(s%8===4)noise(.12,.5,1800,0,t,musicGain);
    if(s%2===1)noise(.03,.18,8000,0,t,musicGain,'highpass');
    if(s%16===3||s%16===11){const r=s<16?57:62;[0,3,7].forEach(i=>osc(NOTE(r+i+12),st*1.2,'square',.07,0,t,musicGain))}
    musStep++;musNext+=st;
  }
}

/* ---------------- DATI DI GIOCO ---------------- */
const STAGES=[
  {name:'PROVE A TAVOLINO',lvl:1,mood:'Il regista è nervoso',wall:['#2c1a33','#0d0710'],light:'rgba(255,214,130,',taunt:'Tu! Il tastierista! Due battute in più?!'},
  {name:'PROVA GENERALE',lvl:2,mood:'Il regista è furioso',wall:['#1b2140','#06070f'],light:'rgba(140,200,255,',taunt:'Ancora quell\'intro? BASTA!'},
  {name:'LA PRIMA',lvl:3,mood:'Il regista è FUORI DI SÉ',wall:['#3e1212','#0f0404'],light:'rgba(255,130,90,',taunt:'Stasera c\'è la Prima e tu mi rovini tutto!'}
];
const DIR_LINES=['TAGLIA! TAGLIA!','DI NUOVO DALL\'INIZIO!','SEI CALANTE!','CHI HA STACCATO IL CAVO?!','PIÙ PIANO CON QUEI FIATI!','NON È IL TUO ASSOLO!','IL TEMPO! IL TEMPO!','SILENZIO IN SALA!','FUORI DAL MIO PALCO!'];
const MUS_LINES=['ERA SCRITTO COSÌ!','LA PARTITURA DICE FORTE!','IO SUONO A TEMPO!','UN ALTRO GIRO DI VAMP!','HAI SALTATO IL CAMBIO!'];
const CHARS={musician:{name:'MUSICISTA',speed:4.4,jump:15.5},director:{name:'REGISTA',speed:3.9,jump:14.8}};
const MOVES={punch:{s:4,a:4,r:9,dmg:5,rng:80,kb:3.2},kick:{s:8,a:5,r:14,dmg:9,rng:104,kb:6.5}};
const AI=[null,{react:24,block:.28,aggr:.38,thr:.22,dodge:.35,sup:.25},{react:15,block:.52,aggr:.5,thr:.28,dodge:.62,sup:.45},{react:9,block:.72,aggr:.62,thr:.34,dodge:.85,sup:.7}];

let projectiles=[],particles=[],shake=0,flashScreen=0,atkCounter=0;

/* ---------------- LOTTATORE ---------------- */
class Fighter{
  constructor(kind){this.kind=kind;this.ch=CHARS[kind];this.reset(300,1)}
  reset(x,f){Object.assign(this,{x,y:GROUND,vx:0,vy:0,facing:f,hp:100,hpLag:100,meter:0,state:'idle',t:0,stun:0,cool:0,hitDone:false,anim:Math.random()*100,flash:0,crouch:false,blocking:false,bubble:null,atkId:0,
    inp:{},prev:{},ai:{q:[],cd:0,seen:new WeakSet(),lastAtk:-1}})}
  isAtk(){return this.state==='punch'||this.state==='kick'||this.state==='throw'||this.state==='super'}
  hurtbox(){if(this.state==='ko')return null;const top=this.state==='crouch'?this.y-92:this.y-160;return{x1:this.x-26,x2:this.x+26,y1:top,y2:this.y}}
  say(t,d){this.bubble={text:t,t:d||110}}
  start(type){this.state=type;this.t=0;this.hitDone=false;this.atkId=++atkCounter;
    if(type==='throw')this.cool=55;
    if(type==='super'){this.meter=0;flashScreen=18;G.freeze=22;
      if(this.kind==='musician'){sfx('superM');this.say('ASSOLO!!!',90)}else{sfx('wave');this.say('SILENZIO IN SALA!!!',90)}}}
  update(o){
    const I=this.inp,P=this.prev,pr=k=>I[k]&&!P[k];
    this.anim++;if(this.flash>0)this.flash--;if(this.bubble&&--this.bubble.t<=0)this.bubble=null;
    if(this.hpLag>this.hp)this.hpLag=Math.max(this.hp,this.hpLag-0.6);
    if(this.cool>0)this.cool--;
    const ground=this.y>=GROUND-0.5;
    if(this.state==='ko'||this.state==='win'||this.state==='lose'){
      this.vy+=0.7;this.y+=this.vy;this.x+=this.vx;
      if(this.y>=GROUND){this.y=GROUND;this.vy=0;this.vx*=0.8}
      this.x=clamp(this.x,40,W-40);this.prev=Object.assign({},I);return;
    }
    if(this.stun>0){
      this.stun--;this.x+=this.vx;this.vx*=0.86;
      this.vy+=0.8;this.y+=this.vy;if(this.y>=GROUND){this.y=GROUND;this.vy=0}
      if(this.stun===0)this.state='idle';
      this.x=clamp(this.x,40,W-40);this.prev=Object.assign({},I);return;
    }
    if(ground&&!this.isAtk())this.facing=o.x>this.x?1:-1;
    const back=this.facing===1?'left':'right';
    if(this.isAtk()){
      this.t++;this.doAttack(o);
      if(ground)this.vx*=0.7;
    }else{
      const mv=(I.right?1:0)-(I.left?1:0);
      this.blocking=ground&&!!I[back];
      if(ground){
        if(I.down){this.vx=0;this.state='crouch'}
        else{this.vx=mv*this.ch.speed*(mv===this.facing?1:0.72);this.state=mv?'walk':'idle'}
        if(I.up&&!I.down){this.vy=-this.ch.jump;this.vx=mv*this.ch.speed*1.05;this.state='jump';this.blocking=false;sfx('jump')}
      }
      if(pr('super')&&this.meter>=100&&ground)this.start('super');
      else if(pr('throw')&&this.cool<=0&&ground)this.start('throw');
      else if(pr('kick'))this.start('kick');
      else if(pr('punch'))this.start('punch');
    }
    // fisica
    this.vy+=0.8;this.y+=this.vy;this.x+=this.vx;
    if(this.y>=GROUND){this.y=GROUND;this.vy=0;if(this.state==='jump')this.state='idle';
      if((this.state==='punch'||this.state==='kick')&&this.airAtk)this.state='idle'}
    if(this.state==='punch'||this.state==='kick'){if(this.t===1)this.airAtk=this.y<GROUND-2}
    this.x=clamp(this.x,40,W-40);
    this.prev=Object.assign({},I);
  }
  doAttack(o){
    const st=this.state;
    if(st==='punch'||st==='kick'){
      const m=MOVES[st];
      if(this.t===m.s)sfx('whoosh');
      if(!this.hitDone&&this.t>=m.s&&this.t<m.s+m.a){
        const air=this.y<GROUND-2;let y1,y2;
        if(st==='punch'){y1=this.y-142;y2=this.y-100}else{y1=air?this.y-70:this.y-98;y2=air?this.y+8:this.y-48}
        const rx=this.x+this.facing*m.rng,xa=Math.min(this.x,rx),xb=Math.max(this.x,rx);
        const hb=o.hurtbox();
        if(hb&&xb>hb.x1&&xa<hb.x2&&y2>hb.y1&&y1<hb.y2){this.hitDone=true;hurt(o,air?m.dmg+2:m.dmg,m.kb*this.facing,this,this.x+this.facing*m.rng*.75,(y1+y2)/2,false)}
      }
      if(this.t>=m.s+m.a+m.r)this.state=this.y<GROUND-2?'jump':'idle';
    }else if(st==='throw'){
      if(this.t===12){spawnProj(this,{});this.meter=Math.min(100,this.meter+3)}
      if(this.t>=28)this.state='idle';
    }else if(st==='super'){
      if(this.kind==='musician'){
        if(this.t>=16&&this.t<=46&&(this.t-16)%6===0)spawnProj(this,{low:((this.t-16)/6)%2===1,dmg:6,speed:9});
      }else if(this.t===20)spawnProj(this,{wave:true});
      if(this.t>=58)this.state='idle';
    }
  }
}
function hurt(t,dmg,kb,a,hx,hy,proj){
  if(t.state==='ko')return;
  const canBlock=t.blocking&&!t.isAtk()&&t.state!=='jump'&&t.y>=GROUND-1;
  if(canBlock){
    t.hp-=dmg*0.15;t.vx=kb*0.9;t.stun=10;t.state='block';
    for(let i=0;i<8;i++)particles.push({type:'spark',x:hx,y:hy,vx:rnd(-4,4),vy:rnd(-4,4),life:16,max:16,col:'#7fdcff',size:rnd(2,4)});
    sfx('block');a.meter=Math.min(100,a.meter+2);t.meter=Math.min(100,t.meter+dmg*.5);
  }else{
    t.hp-=dmg;t.stun=13+dmg;t.state='hit';t.vx=kb;t.flash=8;
    if(t.y<GROUND-1)t.vy=-5;
    shake=Math.max(shake,dmg*0.9);
    for(let i=0;i<14;i++)particles.push({type:'spark',x:hx,y:hy,vx:rnd(-6,6),vy:rnd(-6,4),life:20,max:20,col:pick(['#fff','#ffe14d','#ff8a3d']),size:rnd(2,5)});
    if(a.kind==='musician')for(let i=0;i<3;i++)particles.push({type:'note',x:hx,y:hy,vx:rnd(-2,2),vy:rnd(-3,-1.5),life:40,max:40,col:pick(['#ffe14d','#7fffd4','#ff7ad9']),size:22,ch:pick(['♪','♫','♬'])});
    sfx(dmg>=9?'heavy':'hit');
    a.meter=Math.min(100,a.meter+dmg*1.3);t.meter=Math.min(100,t.meter+dmg*.7);
    if(a===P1)G.score+=dmg*10;
    if(t.kind==='director'&&Math.random()<.22)t.say(pick(DIR_LINES));
    if(t.kind==='musician'&&Math.random()<.12)t.say(pick(MUS_LINES));
  }
  if(t.hp<=0){t.hp=0;t.state='ko';t.stun=0;t.vy=-9;t.vx=(kb>=0?1:-1)*5;sfx('ko');G.slow=60;shake=16;t.bubble=null}
}
function spawnProj(f,o){
  const lowP=f.kind==='musician'?.3:[0,.25,.38,.5][G.lvl];
  const low=o.low!==undefined?o.low:Math.random()<lowP;
  const p={owner:f,x:f.x+f.facing*52,vx:f.facing*(o.speed||7.6),low,y:low?GROUND-20:f.y-120,rot:0,dmg:o.dmg||9,t:0,r:20,
    kind:f.kind==='musician'?(low?'drum':pick(['trumpet','violin','maracas','sax'])):'cable'};
  if(o.wave){p.kind='wave';p.y=f.y-95;p.dmg=22;p.vx=f.facing*8.5;p.r=60;p.low=false}
  projectiles.push(p);
  if(p.kind==='wave'){}else if(f.kind==='musician')sfx('instr',p.kind);else{sfx('cable');if(Math.random()<.3)f.say(pick(DIR_LINES))}
}
function updateProjectiles(){
  for(const p of projectiles){
    p.x+=p.vx;p.t++;p.rot+=(p.kind==='drum'?0.3:0.22)*Math.sign(p.vx);
    if(p.x<-80||p.x>W+80)p.dead=true;
  }
  for(let i=0;i<projectiles.length;i++)for(let j=i+1;j<projectiles.length;j++){
    const a=projectiles[i],b=projectiles[j];if(a.dead||b.dead||a.owner===b.owner)continue;
    if(Math.abs(a.x-b.x)<a.r+b.r-8&&Math.abs(a.y-b.y)<a.r+b.r-4){
      if(a.kind!=='wave')a.dead=true;if(b.kind!=='wave')b.dead=true;
      for(let k=0;k<12;k++)particles.push({type:'spark',x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:rnd(-5,5),vy:rnd(-5,5),life:18,max:18,col:'#fff',size:3});
      sfx('block');
    }
  }
  for(const p of projectiles){
    if(p.dead)continue;const t=p.owner===P1?CPU:P1,hb=t.hurtbox();if(!hb)continue;
    const vr=p.kind==='wave'?70:16;
    if(p.x+p.r*.6>hb.x1&&p.x-p.r*.6<hb.x2&&p.y+vr>hb.y1&&p.y-vr<hb.y2){
      p.dead=true;hurt(t,p.dmg,Math.sign(p.vx)*(p.kind==='wave'?9:5),p.owner,p.x,p.y,true);
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);
}

/* ---------------- IA DEL REGISTA ---------------- */
function cpuThink(f,o){
  const P=AI[G.lvl],inp={left:false,right:false,up:false,down:false,punch:false,kick:false,throw:false,super:false};
  const dx=o.x-f.x,d=Math.abs(dx),fwd=dx>0?'right':'left',back=dx>0?'left':'right';
  // minacce: proiettili in arrivo
  for(const p of projectiles){
    if(p.owner!==o||f.ai.seen.has(p))continue;
    const dist=(f.x-p.x)*Math.sign(p.vx);
    if(dist>0&&dist<230){f.ai.seen.add(p);
      if(Math.random()<P.dodge){f.ai.q=p.kind==='wave'||p.low?[{n:8,i:{up:true}}]:(Math.random()<.5?[{n:26,i:{down:true}}]:[{n:26,i:{[back]:true}}]);}
    }
  }
  // parata contro attacchi ravvicinati
  if(o.isAtk()&&o.atkId!==f.ai.lastAtk&&d<150&&o.state!=='throw'){f.ai.lastAtk=o.atkId;if(Math.random()<P.block)f.ai.q=[{n:16,i:{[back]:true}}]}
  if(f.ai.q.length){const s=f.ai.q[0];Object.assign(inp,s.i);if(--s.n<=0)f.ai.q.shift();return inp}
  if(--f.ai.cd>0){if(f.ai.walk)inp[f.ai.walk]=true;return inp}
  f.ai.cd=P.react+Math.floor(Math.random()*P.react);f.ai.walk=null;
  const r=Math.random();
  if(f.meter>=100&&Math.random()<P.sup){f.ai.q=[{n:2,i:{super:true}},{n:2,i:{}}];return inp}
  if(d>290){
    if(r<P.thr*1.6&&f.cool<=0)f.ai.q=[{n:2,i:{throw:true}},{n:3,i:{}}];
    else if(r<.85)f.ai.walk=fwd;
    else f.ai.q=[{n:3,i:{up:true,[fwd]:true}},{n:14,i:{[fwd]:true}},{n:3,i:{kick:true}}];
  }else if(d>112){
    if(r<P.thr&&f.cool<=0)f.ai.q=[{n:2,i:{throw:true}},{n:3,i:{}}];
    else if(r<P.thr+P.aggr*.8)f.ai.walk=fwd;

function step(){
  G.t++;

    for(const f of [P1,CPU]){f.anim++}

    if(G.screen==='ending'&&G.t%4===0)particles.push({type:'confetti',x:rnd(0,W),y:-10,vx:rnd(-1,1),vy:rnd(1.5,3),life:300,max:300,col:pick(['#ffd23f','#ff4d6d','#4dd2ff','#7dff8a','#c66bff']),size:rnd(5,9),rot:rnd(0,6)});
    updParticles();return;
  }
  if(G.paused)return;
  if(G.freeze>0){G.freeze--;updParticles();return}
  if(G.slow>0){G.slow--;if(G.slow%2)return}
  const live=G.screen==='fight';
  const ti=touchInput();
  const pin={};for(const k of ['left','right','up','down','punch','kick','throw','super'])pin[k]=live&&(keys[k]||ti[k]);
  P1.inp=pin;CPU.inp=live?cpuThink(CPU,P1):{};

  if(P1.state!=='ko'&&CPU.state!=='ko'){const dx=CPU.x-P1.x;if(Math.abs(dx)<62&&Math.abs(P1.y-CPU.y)<120){const push=(62-Math.abs(dx))/2*(dx>=0?1:-1);P1.x=clamp(P1.x-push,40,W-40);CPU.x=clamp(CPU.x+push,40,W-40)}}

  const anger=dirAnger();if(anger>.55&&G.t%Math.round(26-anger*16)===0&&CPU.state!=='ko')particles.push({type:'steam',x:CPU.x+rnd(-12,12),y:CPU.y-178,vx:rnd(-.6,.6),vy:-1.4,life:40,max:40,size:10});

function drawHUD(){
  const bw=Math.min(168,Math.round(NW/2-28)),y=5;
  for(const side of [0,1]){const f=side?CPU:P1,x=side?Math.round(NW/2+18):Math.round(NW/2-18-bw);
    rect(x-2,y-2,bw+4,12,K);rect(x-1,y-1,bw+2,10,'#ffffff');rect(x,y,bw,8,'#b0000c');
    const lw=Math.round(bw*f.hpLag/100),hw=Math.round(bw*f.hp/100);
    rect(side?x:x+bw-lw,y,lw,8,'#ff8a00');rect(side?x:x+bw-hw,y,hw,8,'#ffe000');rect(side?x:x+bw-hw,y+1,hw,2,'#fff8b0');
    text(f.ch.name,side?x+bw:x,y+12,'#ffffff',1,side?'right':'left',{sh:K});
    for(let i=0;i<2;i++){const wx=side?x+bw-72-i*10:x+64+i*10;rect(wx,y+12,8,8,K);rect(wx+1,y+13,6,6,G.wins[side]>i?'#ffd23f':'#3a3a44')}
    const mw=Math.round(bw*.55),mx=side?x+bw-mw:x,my=y+23;rect(mx-1,my-1,mw+2,5,K);rect(mx,my,mw,3,'#2a1040');
    const full=f.meter>=100,mm=Math.round(mw*f.meter/100);rect(side?mx+mw-mm:mx,my,mm,3,full?((G.t>>2)%2?'#ffffff':'#40e0ff'):'#3a7bff');
    if(full)text('SUPER',side?mx-4:mx+mw+4,my-2,'#40e0ff',1,side?'right':'left',{sh:K})}
  rect(NW/2-14,y-3,28,13,K);rect(NW/2-13,y-2,26,11,'#d42000');text('KO',NW/2,y,'#ffe000',1,'center');
  const tm=String(Math.max(0,Math.ceil(G.timer/60))).padStart(2,'0');text(tm,NW/2,y+14,G.timer<600&&(G.t>>3)%2?'#ff4030':'#ffe000',2,'center',{out:K});
  if(touchUI){const L=layout(),X=L.pause.x*LS,Y=L.pause.y*LS;rect(X-7,Y-7,14,14,K);rect(X-6,Y-6,12,12,'#4a4a56');rect(X-3,Y-3,2,6,'#ffffff');rect(X+1,Y-3,2,6,'#ffffff')}
  text('PUNTI '+G.score,NW/2,NH-9,'#ffffff',1,'center',{out:K})}
function drawControls(){if(!touchUI)return;const L=layout(),ti=touchInput();
  const PX=L.pad.x*LS,PY=L.pad.y*LS,PR=L.pad.r*LS;disc(PX,PY,PR,K,{b:.35});
  for(let a=0;a<Math.PI*2;a+=.05)px(PX+Math.cos(a)*PR,PY+Math.sin(a)*PR,'#8a8a9a');
  const ar=(dx,dy,on)=>{const cx=PX+dx*22,cy=PY+dy*22,c=on?'#ffe000':'#d8d8e0';if(dx)poly([[cx+dx*6,cy],[cx-dx*4,cy-6],[cx-dx*4,cy+6]],c);else poly([[cx,cy+dy*6],[cx-6,cy-dy*4],[cx+6,cy-dy*4]],c)};
  ar(-1,0,ti.left);ar(1,0,ti.right);ar(0,-1,ti.up);ar(0,1,ti.down);
  let kx=PX,ky=PY;for(const p of pointers.values()){if(p.x<W*.45&&Math.hypot(p.x-L.pad.x,p.y-L.pad.y)<L.pad.r*1.8){const a=Math.atan2(p.y-L.pad.y,p.x-L.pad.x),d=Math.min(16,Math.hypot(p.x-L.pad.x,p.y-L.pad.y)*LS);kx+=Math.cos(a)*d;ky+=Math.sin(a)*d}}
  disc(kx,ky,10,'#d8d8e0',{b:.45});
  for(const b of L.btn){const X=b.x*LS,Y=b.y*LS,R=L.br*LS,on=ti[b.k],dis=(b.k==='super'&&P1.meter<100)||(b.k==='throw'&&P1.cool>0);
    disc(X,Y,R+1,K,{b:dis?.25:.5});disc(X,Y,R,on?'#ffffff':b.c,on?0:{b:dis?.3:.6});text(b.l,X,Y-3,dis?'#9a9aa8':'#ffffff',1,'center',{out:K})}}
function drawTitle(){dim(.5);
  const bo=Math.round(Math.sin(G.t*.06)*2);
  text('ANGRY',NW/2,18+bo,'#ffe000',3,'center',{out:'#6a0010'});text('MUSICIAN',NW/2,42+bo,'#ff3020',4,'center',{out:'#ffffff'});
  text('IL MUSICISTA CONTRO IL REGISTA INCAZZATO',NW/2,78,'#ffffff',1,'center',{sh:K});
  nbutton('GIOCA',NW/2,104,96,22,()=>startArcade(),'#ffd23f',2);
  const showFS=fsOK&&!isApp&&!document.fullscreenElement;
  nbutton('COME SI GIOCA',showFS?NW/2-54:NW/2,134,100,16,()=>{G.howto=true},'#7fdcff');
  if(showFS)nbutton('SCHERMO INTERO',NW/2+54,134,100,16,goFullscreen,'#c6a7ff');
  nbutton('MUSICA: '+(musicOn?'SÌ':'NO'),NW/2-44,158,82,14,()=>{musicOn=!musicOn;store.set('am_music',musicOn)},'#d8d8e0');
  nbutton('EFFETTI: '+(sfxOn?'SÌ':'NO'),NW/2+44,158,82,14,()=>{sfxOn=!sfxOn;store.set('am_sfx',sfxOn)},'#d8d8e0');
  if(G.best>0)text('RECORD '+G.best,NW/2,176,'#ffd23f',1,'center',{out:K});
  if(G.howto){uiButtons=[];dim(.85);text('COME SI GIOCA',NW/2,14,'#ffd23f',2,'center',{out:K});
    const L=['CROCE: MUOVITI · SU SALTA · GIU ABBASSATI','TIENI INDIETRO = PARATA','PUGNO E CALCIO, ANCHE IN SALTO','LANCIO: STRUMENTI (IL TAMBURO VA BASSO)','SUPER: BARRA BLU PIENA = ASSOLO!','CAVI ALTI: ABBASSATI · CAVI BASSI: SALTA','VINCI 2 ROUND SU 3 PER CAMBIARE SCENA'];
    L.forEach((r,i)=>text(r,NW/2,42+i*16,i%2?'#ffffff':'#7fdcff',1,'center'));
    nbutton('HO CAPITO',NW/2,174,90,18,()=>{G.howto=false},'#ffd23f')}}
function drawVS(){const k=Math.min(1,G.t/25);
  rect(0,0,NW,NH,'#120814');
  poly([[0,0],[NW*.56*k,0],[NW*.44*k,NH],[0,NH]],'#1d3a8a');poly([[NW,0],[NW-NW*.44*k,0],[NW-NW*.56*k,NH],[NW,NH]],'#8a1020');
  for(let y=0;y<NH;y+=4)blendSpan(0,NW,y,'#000000',.25);
  const sv=[P1.x,P1.y,P1.facing,P1.state,CPU.x,CPU.y,CPU.facing,CPU.state];
  P1.facing=1;P1.state='idle';CPU.facing=-1;CPU.state='idle';P1.y=GROUND;CPU.y=GROUND;
  drawFighter(P1,NW*.22,NH*.82,1.9);drawFighter(CPU,NW*.78,NH*.82,1.9);
  [P1.x,P1.y,P1.facing,P1.state,CPU.x,CPU.y,CPU.facing,CPU.state]=sv;
  const vs=Math.round(Math.sin(G.t*.2)*1);text('VS',NW/2,NH*.38+vs,'#ffe000',5,'center',{out:K});
  text('MUSICISTA',NW*.22,NH-20,'#ffffff',2,'center',{out:K});text('REGISTA',NW*.78,NH-20,'#ffffff',2,'center',{out:K});
  text('SCENA '+(G.stage+1)+': '+STAGES[G.stage].name,NW/2,8,'#ffffff',1,'center',{out:K});
  text(STAGES[G.stage].mood+'  RABBIA '+'★'.repeat(G.lvl),NW/2,22,'#ffd23f',1,'center',{out:K})}
function drawPause(){dim(.7);text('PAUSA',NW/2,26,'#ffd23f',4,'center',{out:K});
  nbutton('RIPRENDI',NW/2,86,110,20,()=>{G.paused=false},'#ffd23f',2);
  nbutton('MUSICA: '+(musicOn?'SÌ':'NO'),NW/2-50,116,92,16,()=>{musicOn=!musicOn;store.set('am_music',musicOn)},'#d8d8e0');
  nbutton('EFFETTI: '+(sfxOn?'SÌ':'NO'),NW/2+50,116,92,16,()=>{sfxOn=!sfxOn;store.set('am_sfx',sfxOn)},'#d8d8e0');
  nbutton('ESCI AL MENU',NW/2,144,110,18,()=>{G.paused=false;saveBest();G.screen='title';G.t=0;projectiles=[];particles=[];P1.reset(W*.3,1);CPU.reset(W*.7,-1)},'#ff7a6b')}
function drawStageClear(){dim(.6);text('SCENA SUPERATA!',NW/2,30,'#ffd23f',3,'center',{out:K});
  text('IL REGISTA SI È CALMATO... PER ORA.',NW/2,64,'#ffffff',1,'center',{sh:K});text('PUNTI '+G.score,NW/2,82,'#ffffff',2,'center',{out:K});
  text('PROSSIMA SCENA: '+STAGES[G.stage].name,NW/2,108,'#ffb3a8',1,'center',{sh:K});text(STAGES[G.stage].mood,NW/2,120,'#ffb3a8',1,'center',{sh:K});
  nbutton('AVANTI',NW/2,148,100,22,()=>toVS(),'#ffd23f',2)}
function drawGameOver(){dim(.7);text('SEI LICENZIATO!',NW/2,30,'#ff3020',3,'center',{out:'#ffffff'});
  text("IL REGISTA TI HA CACCIATO DALL'ORCHESTRA.",NW/2,66,'#ffffff',1,'center',{sh:K});text('PUNTI '+G.score,NW/2,84,'#ffd23f',2,'center',{out:K});
  nbutton('RIPROVA',NW/2,120,100,22,()=>{G.score=Math.floor(G.score/2);toVS()},'#ffd23f',2);
  nbutton('MENU',NW/2,150,80,16,()=>{G.screen='title';G.t=0;P1.reset(W*.3,1);CPU.reset(W*.7,-1)},'#d8d8e0')}
function drawEnding(){dim(.72);text('BRAVO!!!',NW/2,22,'#ffe000',5,'center',{out:'#6a0010'});
  text('IL SIPARIO SI APRE, IL MUSICAL VA IN SCENA.',NW/2,70,'#ffffff',1,'center',{sh:K});
  text('IL REGISTA, SFINITO, APPLAUDE IN SILENZIO.',NW/2,82,'#ffffff',1,'center',{sh:K});
  text('PUNTI FINALI '+G.score,NW/2,100,'#ffffff',2,'center',{out:K});if(G.score>=G.best)text('NUOVO RECORD!',NW/2,120,'#7dff8a',1,'center',{out:K});
  nbutton('MENU',NW/2,150,90,20,()=>{G.screen='title';G.t=0;G.stage=0;particles=[];P1.reset(W*.3,1);CPU.reset(W*.7,-1)},'#ffd23f',2)}
function demoPose(){P1.x=W*.3;P1.y=GROUND;P1.facing=1;P1.state='idle';CPU.x=W*.7;CPU.y=GROUND;CPU.facing=-1;CPU.state='idle'}

function render(){
  uiButtons=[];
  if(G.screen==='vs'){drawVS()}
  else{
    const si=Math.min(G.stage,STAGES.length-1);
    drawStage(G.screen==='title'?0:si,G.t);
    if(G.screen==='title')demoPose();
    const sx=shake>0?Math.round(rnd(-shake,shake)*LS):0,sy=shake>0?Math.round(rnd(-shake,shake)*LS):0;
    const order=CPU.state==='ko'?[CPU,P1]:[P1,CPU];for(const f of order)drawFighter(f,f.x*LS+sx,f.y*LS+sy,1);
    for(const p of projectiles)drawProj(p);
    drawParticles();
    if(flashScreen>0)for(let y=0;y<NH;y++)blendSpan(0,NW,y,'#ffffff',Math.min(.85,flashScreen/22));
    bubRects=[];if(!G.paused&&(G.screen==='fight'||G.screen==='intro'||(G.screen==='roundEnd'&&G.t>=90)))for(const f of [P1,CPU])if(f.bubble)bubbleN(f.x*LS,(f.y-190)*LS,f.bubble.text,f.kind==='musician');
    if(G.screen==='title')drawTitle();
    else{
      drawHUD();
      if(G.screen==='fight'||G.screen==='intro')drawControls();
      if(G.screen==='intro'){if(G.t<70)text('ROUND '+G.round,NW/2,74,'#ffe000',4,'center',{out:'#6a0010'});else text('AZIONE!',NW/2,70,'#ffffff',5,'center',{out:'#b8161f'})}
      if(G.screen==='roundEnd'){const ko=P1.state==='ko'||CPU.state==='ko';
        if(G.t<90){if(ko)text('K.O.',NW/2,64,'#ff3020',6,'center',{out:'#ffffff'});else text('TEMPO SCADUTO!',NW/2,72,'#ff3020',3,'center',{out:'#ffffff'})}
        else text(G.rw===0?'HAI VINTO IL ROUND!':G.rw===1?'IL REGISTA VINCE IL ROUND':'PAREGGIO',NW/2,76,G.rw===0?'#ffd23f':'#ff7a6b',2,'center',{out:K})}
      if(G.paused)drawPause();
      if(G.screen==='stageClear')drawStageClear();
      if(G.screen==='gameover')drawGameOver();
      if(G.screen==='ending')drawEnding();
    }
  }
  bctx.putImageData(buf,0,0);
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  if(dX||dY){ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height)}
  ctx.drawImage(bcan,dX,dY,NW*dS,NH*dS);
}

/* ---------------- LOOP ---------------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60}
  if(AC)musicTick();
  render();requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.screen==='fight'||G.screen==='intro')G.paused=true;if(AC)AC.suspend()}else if(AC)AC.resume()});
P1.reset(W*.3,1);CPU.reset(W*.7,-1);
requestAnimationFrame(frame);
window.__G=G;window.__P1=P1;window.__CPU=CPU;window.__keys=keys;
</script>
