<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/sm-192.png">
<link rel="apple-touch-icon" href="../icons/sm-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Spare Mic</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{outline:none;position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#07101c;color:#5ff2ff;font:900 22px/1.3 Impact,"Arial Black",sans-serif;text-align:center;padding:24px;z-index:5;letter-spacing:1px}
#rotate .ph{width:70px;height:120px;border:5px solid #5ff2ff;border-radius:14px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="rotate"><div class="ph"></div><div>SPARE MIC</div><div>Ruota il telefono in orizzontale</div></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=540,GROUND=448;
let W=960,scale=1,dpr=1,offY=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);scale=Math.min(cv.height/H,cv.width/780);W=cv.width/scale;offY=(cv.height/scale-H)/2}
addEventListener('resize',resize);resize();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- AUDIO ---------- */
let AC=null,master=null,mus=null,nbuf=null,musicOn=store.get('sm_music',true),sfxOn=store.get('sm_sfx',true);
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=.2;mus.connect(master);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function osc(f,dur,type,vol,slide,t0,dest){const t=t0||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,f1,f2,t0,dest,type){const t=t0||AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type=type||'bandpass';f.frequency.setValueAtTime(f1,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+.03)}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const SFX={
  whoosh(){noise(.12,.25,700,3500)},
  slap(){noise(.09,.7,3500,900);noise(.05,.5,7000);osc(160,.1,'sine',.5,60)},
  word(){osc(NOTE(pick([67,69,71,72,74,76,79])),.07,'square',.06)},
  hit(){osc(220,.12,'square',.15,90);noise(.1,.35,3000,600)},
  hurt(){osc(300,.3,'sawtooth',.2,80);noise(.25,.3,1200,200)},
  feedback(){osc(2200,.5,'sine',.08,3400)},
  zap(){noise(.3,.45,6000,800);osc(90,.25,'square',.15,40)},
  warn(){osc(880,.07,'square',.07)},
  beam(){osc(1800,.7,'sawtooth',.06,2600);noise(.7,.15,5000,2000,0,0,'highpass')},
  dive(){osc(800,.4,'sawtooth',.12,120)},
  pick(){osc(NOTE(84),.08,'square',.12);osc(NOTE(91),.14,'square',.12,0,AC.currentTime+.07)},
  heal(){[72,76,79,84].forEach((n,i)=>osc(NOTE(n),.12,'triangle',.18,0,AC.currentTime+i*.06))},
  mono(){[60,64,67,72,76,79,84].forEach((n,i)=>osc(NOTE(n),.25,'sawtooth',.09,0,AC.currentTime+i*.07))},
  boom(){noise(.8,.6,1500,60,0,0,'lowpass');osc(70,.8,'sine',.6,30)},
  win(){[60,64,67,72,67,72,76].forEach((n,i)=>osc(NOTE(n+12),.2,'square',.12,0,AC.currentTime+i*.12))},
  lose(){[67,63,60,55].forEach((n,i)=>osc(NOTE(n),.35,'triangle',.2,0,AC.currentTime+i*.22))},
  sel(){osc(660,.08,'square',.12,990)},
  jump(){osc(320,.1,'square',.06,640)}
};
function sfx(n){if(AC&&sfxOn)try{SFX[n]()}catch(e){}}
const MBASS=[0,0,7,0,10,0,7,5, 0,0,7,0,12,10,7,5, 3,3,10,3,12,3,10,8, 5,5,12,5,7,7,14,12];
let mStep=0,mNext=0,mOn=false;
function musicTick(){const want=musicOn&&AC&&(G.screen==='play'||G.screen==='intro')&&!G.paused;if(!want){mOn=false;return}
  if(!mOn){mOn=true;mNext=AC.currentTime+.05;mStep=0}
  const st=60/(132+G.lvl*10)/4;
  while(mNext<AC.currentTime+.15){const s=mStep%32,t=mNext;
    osc(NOTE(38+MBASS[s]),st*1.5,'square',.22,0,t,mus);
    if(s%4===0)osc(120,.1,'sine',.9,40,t,mus);if(s%8===4)noise(.1,.5,2500,0,t,mus);if(s%2)noise(.025,.15,9000,0,t,mus,'highpass');
    if(s%8===6){const r=62+MBASS[s];osc(NOTE(r+12),st*2,'sawtooth',.05,0,t,mus);osc(NOTE(r+19),st*2,'sawtooth',.04,0,t,mus)}
    mStep++;mNext+=st}}

/* ---------- DATI ---------- */
const LEVELS=[
  {name:'SOUNDCHECK',lvl:1,hp:50,sub:'Il microfono fa i capricci',sky:['#0b1a33','#04070f'],light:'rgba(120,220,255,',line:'PROVA... PROVA... BZZZT!'},
  {name:'PROVA GENERALE',lvl:2,hp:75,sub:'Il microfono fischia come un treno',sky:['#24103a','#08040f'],light:'rgba(255,120,240,',line:'FIIIIIIIIIIIII!!!'},
  {name:'LA PRIMA',lvl:3,hp:100,sub:'Il microfono è posseduto',sky:['#3a0b0b','#0f0303'],light:'rgba(255,170,60,',line:'CRRR... TU... NON... RECITERAI!'}
];
const MIC_LINES=['BZZZT!','FIIIIII!','PROVA... PROVA...','UNO DUE... TRE?','CRRRR... SA SA...','CHI HA TOCCATO IL MIXER?!','KSHHHH...'];
const ACT_LINES=['SHOWTIME!','LO SPETTACOLO DEVE CONTINUARE!','CINQUE, SEI, SETTE, OTTO!','TI FACCIO VEDERE IO!','UN MICROFONO DI RISERVA, PRESTO!'];
const WORDS=['SHOWTIME!','BRAVO!','BIS!','FORTISSIMO!','APPLAUSI!','SIPARIO!','DO RE MI!','JAZZ HANDS!','ENCORE!','CANTA!','TUTTI!','FINALE!','LA LA LA!','OVAZIONE!','CINQUE SEI SETTE OTTO!','A TEMPO!','PRIMA FILA!','DA CAPO!'];
const AI=[null,{every:120,ring:1,bolts:2,dive:.2,beam:0,spd:1},{every:95,ring:3,bolts:3,dive:.25,beam:.25,spd:1.25},{every:72,ring:5,bolts:4,dive:.28,beam:.3,spd:1.55}];

/* ---------- STATO ---------- */
const P={},B={};let words=[],shots=[],foes=[],items=[],parts=[],shake=0,flash=0;
const G={screen:'title',lvl:1,stage:0,t:0,score:0,paused:false,best:store.get('sm_best',0),howto:false};
function resetPlayer(){Object.assign(P,{x:W*.3,y:GROUND,vx:0,vy:0,face:1,hp:5,inv:0,cool:0,meter:0,anim:0,slapT:0,slapHit:false,hurtT:0,bubble:null,mono:0})}
function resetBoss(){const L=LEVELS[G.stage];Object.assign(B,{x:W*.65,y:230,tx:W*.65,ty:230,kx:0,stun:0,hp:L.hp,max:L.hp,t:0,mode:'float',mt:0,next:110,fl:0,bubble:{text:L.line,t:150},dead:0,glitch:0})}
function startGame(){G.stage=0;G.score=0;startLevel()}
function startLevel(){G.lvl=LEVELS[G.stage].lvl;resetPlayer();resetBoss();shots=[];words=[];foes=[];items=[];parts=[];G.screen='intro';G.t=0;G.paused=false}
function say(o,t,d){o.bubble={text:t,t:d||100}}

/* ---------- INPUT ---------- */
const keys={},kp={};const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'fire',KeyZ:'fire',KeyK:'fire',KeyX:'fire',Enter:'fire',KeyL:'mono',KeyC:'mono',KeyI:'mono'};
addEventListener('keydown',e=>{initAudio();const a=KM[e.code];if(a){keys[a]=true;kp[a]=true;e.preventDefault()}if(e.code==='Escape'||e.code==='KeyP')togglePause();if(e.code==='Enter'&&!e.repeat){const b=ui[0];if(b){sfx('sel');b.fn()}}});
addEventListener('keyup',e=>{const a=KM[e.code];if(a)keys[a]=false});
const ptr=new Map();let touchUI=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function toL(e){return{x:e.clientX*dpr/scale,y:e.clientY*dpr/scale-offY}}
cv.addEventListener('pointerdown',e=>{initAudio();if(e.pointerType==='touch')touchUI=true;const p=toL(e);ptr.set(e.pointerId,p);if(G.screen==='play'&&touchUI){const L=layout();for(const bb of L.btn)if(Math.hypot(p.x-bb.x,p.y-bb.y)<L.br*1.25)kp[bb.k]=true}try{cv.setPointerCapture(e.pointerId)}catch(_){}autoFS();tap(p);try{window.focus();cv.focus({preventScroll:true})}catch(_){}if(e.pointerType!=='mouse')e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,toL(e))});
const pu=e=>ptr.delete(e.pointerId);cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);cv.addEventListener('lostpointercapture',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
function layout(){return{pad:{x:112,y:H-104,r:82},br:44,btn:[{k:'fire',x:W-110,y:H-96,l:'SCHIAFFO',c:'#5ff2ff'},{k:'jump',x:W-226,y:H-70,l:'SALTA',c:'#ffd23f'},{k:'mono',x:W-150,y:H-206,l:'MONOLOGO',c:'#ff4fd8'}],pause:{x:W/2,y:52,r:18}}}
function touchIn(){const s={left:false,right:false,jump:false,fire:false,mono:false};if(!touchUI)return s;const L=layout();
  for(const p of ptr.values()){const dx=p.x-L.pad.x,dy=p.y-L.pad.y;if(p.x<W*.45&&Math.hypot(dx,dy)<L.pad.r*1.8){if(dx<-18)s.left=true;if(dx>18)s.right=true;if(dy<-40)s.jump=true;continue}
    for(const b of L.btn)if(Math.hypot(p.x-b.x,p.y-b.y)<L.br*1.25)s[b.k]=true}return s}
let ui=[],prev={};
function tap(p){if(G.screen==='play'&&!G.paused&&touchUI){const L=layout();if(Math.hypot(p.x-L.pause.x,p.y-L.pause.y)<L.pause.r+14){togglePause();return}}
  for(const b of ui)if(p.x>b.x-b.w/2&&p.x<b.x+b.w/2&&p.y>b.y-b.h/2&&p.y<b.y+b.h/2){sfx('sel');b.fn();return}}
function togglePause(){if(G.screen==='play'||G.screen==='intro'){G.paused=!G.paused;keys.left=keys.right=false}}
function goFull(){try{const el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen;if(r){const pr=r.call(el);const lk=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(pr&&pr.then)pr.then(lk).catch(()=>{});else lk()}}catch(e){}}
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);const isApp=(()=>{try{return matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}function autoFS(){if(fsOK&&touchUI&&!isFS()&&!isApp&&innerWidth>innerHeight)goFull()}

/* ---------- LOGICA ---------- */
function hurtPlayer(n){if(P.inv>0||G.screen!=='play')return;P.hp-=n;P.inv=80;P.hurtT=20;shake=10;sfx('hurt');
  for(let i=0;i<14;i++)parts.push({k:'spark',x:P.x,y:P.y-80,vx:rnd(-5,5),vy:rnd(-6,2),life:24,max:24,col:pick(['#ff4d4d','#fff','#ffd23f']),s:rnd(2,5)});
  if(Math.random()<.4)say(P,pick(['AHIA!','STONATO!','HO PERSO LA BATTUTA!','CHE FISCHIO!']),60);
  if(P.hp<=0){P.hp=0;G.screen='over';G.t=0;sfx('lose');saveBest()}}
function hitBoss(n,x,y,slap){if(B.dead)return;B.hp-=n;B.fl=6;G.score+=n*25;if(slap)P.meter=Math.min(100,P.meter+n*3.4);sfx(slap?'slap':'hit');
  if(slap)parts.push({k:'pop',x,y:y-20,vx:0,vy:-1.2,life:34,max:34,t:pick(['SCIAFF!','SLAP!','STACK!','PAF!'])});
  for(let i=0;i<8;i++)parts.push({k:'spark',x,y,vx:rnd(-4,4),vy:rnd(-4,3),life:18,max:18,col:pick(['#5ff2ff','#fff','#ffd23f']),s:rnd(2,4)});
  if(Math.random()<.18)say(B,pick(MIC_LINES),70);
  if(Math.random()<.07)items.push({k:'note',x,y,vy:-2,t:0});
  if(B.hp<=0){B.hp=0;B.dead=1;foes=[];words=[];sfx('boom');shake=20;G.score+=5000+P.hp*500;
    for(let i=0;i<60;i++)parts.push({k:'spark',x:B.x,y:B.y,vx:rnd(-9,9),vy:rnd(-9,6),life:50,max:50,col:pick(['#fff','#ffd23f','#5ff2ff','#ff4fd8']),s:rnd(3,7)});
    G.screen='clear';G.t=0;setTimeout(()=>sfx('win'),400);saveBest()}}
function saveBest(){if(G.score>G.best){G.best=G.score;store.set('sm_best',G.best)}}
function bossAttack(){const A=AI[G.lvl],r=Math.random();
  if(r<A.dive){B.mode='windup';B.mt=0;sfx('dive');say(B,'KSHHHH...!',50);return}
  if(r<A.dive+A.beam){foes.push({k:'beam',y:GROUND-26,t:0,warn:55,act:26});sfx('warn');return}
  if(r<.62){const n=A.ring,ang=Math.atan2(P.y-80-B.y,P.x-B.x);for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.32;foes.push({k:'ring',x:B.x,y:B.y+10,vx:Math.cos(a)*4.2*A.spd,vy:Math.sin(a)*4.2*A.spd,r:16,t:0})}sfx('feedback');if(Math.random()<.3)say(B,'FIIIIII!',50)}
  else{const xs=[P.x];for(let i=1;i<A.bolts;i++)xs.push(rnd(60,W-60));xs.forEach(x=>foes.push({k:'bolt',x,t:0,warn:52,act:18}));sfx('warn')}}
function step(){
  G.t++;
  if(G.screen!=='play'&&G.screen!=='intro'&&G.screen!=='clear'){updParts();if(G.screen==='end'&&G.t%4===0)parts.push({k:'conf',x:rnd(0,W),y:-10,vx:rnd(-1,1),vy:rnd(1.5,3),life:300,max:300,col:pick(['#5ff2ff','#ff4fd8','#ffd23f','#7dff8a']),s:rnd(5,9),rot:rnd(0,6)});return}
  if(G.paused)return;
  if(G.screen==='intro'){animBoss();if(G.t>=110)G.screen='play';updParts();return}
  if(G.screen==='clear'){updParts();P.anim++;if(G.t>=200){G.stage++;if(G.stage>=LEVELS.length){G.screen='end';G.t=0;parts=[]}else{G.screen='stageok';G.t=0}}return}
  const ti=touchIn(),I={};for(const k of ['left','right','jump','fire','mono'])I[k]=keys[k]||ti[k]||kp[k];for(const k in kp)kp[k]=false;
  const pr=k=>I[k]&&!prev[k];
  // giocatore
  P.anim++;if(P.inv>0)P.inv--;if(P.cool>0)P.cool--;if(P.hurtT>0)P.hurtT--;if(P.bubble&&--P.bubble.t<=0)P.bubble=null;
  const mv=(I.right?1:0)-(I.left?1:0);P.vx=mv*5.2;if(mv)P.face=mv;
  const ground=P.y>=GROUND-.5;if(I.jump&&ground){P.vy=-15;sfx('jump')}
  P.vy+=.8;P.y+=P.vy;P.x=clamp(P.x+P.vx,30,W-30);if(P.y>=GROUND){P.y=GROUND;P.vy=0}
  if(I.fire&&P.cool<=0&&P.mono<=0){P.cool=17;P.slapT=12;P.slapHit=false;sfx('whoosh')}
  if(P.slapT>0){P.slapT--;if(!P.slapHit&&P.slapT<=9&&P.slapT>=4){const hx=P.x+P.face*58,hy=P.y-112;
    if(!B.dead&&Math.hypot(hx-B.x,hy-(B.y+18))<74){P.slapHit=true;hitBoss(3,hx,hy,true);B.kx=P.face*10;B.fl=8;shake=Math.max(shake,4)}}}
  if(pr('mono')&&P.meter>=100&&P.mono<=0){P.meter=0;P.mono=1;sfx('mono');say(P,'E ADESSO... IL MIO MONOLOGO!!!',110);flash=14;foes=[];B.stun=Math.max(B.stun,230);B.mode='float'}
  if(P.mono>0){P.mono++;P.vx=0;if(P.mono%4===0&&!B.dead){const mx=P.x+P.face*16,my=P.y-142;words.push({x:mx,y:my,t:pick(WORDS),vx:P.face*rnd(3,6),vy:rnd(-5,1),age:0,col:pick(['#ffd23f','#5ff2ff','#ff4fd8','#7dff8a','#fff'])});if(P.mono%8===0)sfx('word')}if(P.mono>150)P.mono=0}
  for(const w of words){w.age++;const dx=B.x-w.x,dy=B.y-w.y,d=Math.hypot(dx,dy)||1;const k=Math.min(1,w.age/25);w.vx=lerp(w.vx,dx/d*9,.06*k);w.vy=lerp(w.vy,dy/d*9,.06*k);w.x+=w.vx;w.y+=w.vy;
    if(!B.dead&&d<52){w.dead=1;hitBoss(1,w.x,w.y,false);B.stun=Math.max(B.stun,60)}if(w.age>240)w.dead=1}
  words=words.filter(w=>!w.dead);
  prev=Object.assign({},I);
  // colpi
  for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.vy+=.12;s.rot+=.35;
    if(!B.dead&&Math.hypot(s.x-B.x,s.y-(B.y+25))<60){s.dead=1;hitBoss(2,s.x,s.y)}
    if(s.y<-40||s.y>H+40)s.dead=1}
  shots=shots.filter(s=>!s.dead);
  // boss
  animBoss();
  if(!B.dead){if(B.stun<=0)B.next--;if(B.next<=0&&B.mode==='float'&&B.stun<=0){bossAttack();B.next=AI[G.lvl].every+Math.floor(rnd(0,40))}
    if(B.mode==='dive'&&Math.hypot(P.x-B.x,(P.y-80)-(B.y+30))<70)hurtPlayer(1)}
  // nemici
  for(const f of foes){f.t++;
    if(f.k==='ring'){f.x+=f.vx;f.y+=f.vy;f.r+=.12;if(Math.hypot(f.x-P.x,f.y-(P.y-80))<f.r+22)hurtPlayer(1),f.dead=1;if(f.x<-60||f.x>W+60||f.y<-60||f.y>H+60)f.dead=1}
    else if(f.k==='bolt'){if(f.t===f.warn){sfx('zap');shake=Math.max(shake,5)}if(f.t>f.warn&&f.t<f.warn+f.act&&Math.abs(P.x-f.x)<26)hurtPlayer(1);if(f.t>f.warn+f.act)f.dead=1;if(f.t<f.warn&&f.t%12===0)sfx('warn')}
    else if(f.k==='beam'){if(f.t===f.warn)sfx('beam');if(f.t>f.warn&&f.t<f.warn+f.act&&P.y>GROUND-46)hurtPlayer(1);if(f.t>f.warn+f.act)f.dead=1}}
  foes=foes.filter(f=>!f.dead);
  // oggetti
  if(G.t%900===0)items.push({k:'bat',x:rnd(80,W-80),y:-20,vy:1,t:0});
  for(const it of items){it.t++;it.vy=Math.min(it.vy+.15,3);it.y+=it.vy;if(it.y>GROUND-14){it.y=GROUND-14;it.vy=0}
    if(Math.hypot(it.x-P.x,it.y-(P.y-50))<46){it.dead=1;if(it.k==='bat'){P.hp=Math.min(5,P.hp+1);sfx('heal')}else{G.score+=200;sfx('pick')}}
    if(it.t>600)it.dead=1}
  items=items.filter(i=>!i.dead);
  updParts();
  if(shake>0)shake*=.85;if(shake<.3)shake=0;if(flash>0)flash--;
}
function animBoss(){B.t++;if(B.fl>0)B.fl--;if(B.bubble&&--B.bubble.t<=0)B.bubble=null;if(B.dead)return;
  const sp=AI[G.lvl].spd;
